<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110" role="img" aria-labelledby="title desc">
<title id="title">Show competing narratives</title><desc id="desc">Three different news pages are presented side by side, with none dominating the other.</desc>
<style>
      .motion { transform-box: fill-box; transform-origin: center; }
      @media screen and (prefers-reduced-motion: no-preference) {
        .select-pop { animation: select-pop 6s ease-in-out infinite; }
        .select-trace { animation: select-trace 6s ease-in-out infinite; }
        .excluded { animation: excluded 6s ease-in-out infinite; }
        .search { animation: search 5.2s ease-in-out infinite; }
        .compare-left { animation: compare-left 5.8s ease-in-out infinite; }
        .compare-right { animation: compare-right 5.8s ease-in-out infinite; }
        .prompt-wave { animation: pulse 5.8s ease-in-out infinite; }
        .equal-mark { animation: pulse 6.5s ease-in-out infinite; }
      }
      @media print, (prefers-reduced-motion: reduce) { .motion, .select-trace { animation: none!important; } }
      @keyframes select-pop { 0%,100% { transform: translateY(0); } 28%,46% {transform:translateY(-3px);} 66% {transform:translateY(0);} }
      @keyframes select-trace { 0%,100%{opacity:1;} 35%{opacity:.52;} 60%{opacity:1;} }
      @keyframes excluded { 0%,100%{transform:translateX(0) rotate(0deg);} 35%,48%{transform:translateX(4px) rotate(1.2deg);} 75%{transform:translateX(0) rotate(0deg);} }
      @keyframes search {0%,100%{transform:translate(0,0);} 32%,48%{transform:translate(-5px,-1px);} 70%{transform:translate(0,0);} }
      @keyframes compare-left {0%,100%{transform:translateX(0);} 35%,52%{transform:translateX(-3px);} 75%{transform:translateX(0);} }
      @keyframes compare-right {0%,100%{transform:translateX(0);} 35%,52%{transform:translateX(3px);} 75%{transform:translateX(0);} }
      @keyframes pulse {0%,100%{opacity:1;} 40%{opacity:.54;} 62%{opacity:1;}}
</style>
